<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR Test</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    main {
      justify-content: flex-start;
      text-align: left;
    }
    .layout {
      display: grid;
      gap: 1.5rem;
      width: 100%;
      max-width: 52rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) {
      .layout {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }
    form {
      display: grid;
      gap: 0.875rem;
    }
    label {
      display: grid;
      gap: 0.25rem;
      font-weight: 600;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.875rem;
    }
    textarea,
    select,
    input[type="number"],
    input[type="file"] {
      font: inherit;
      font-weight: 400;
      width: 100%;
    }
    textarea {
      min-height: 5rem;
      padding: 0.5rem;
      resize: vertical;
    }
    input[type="color"] {
      width: 3.5rem;
      height: 2.5rem;
      padding: 0;
    }
    .preview {
      display: grid;
      gap: 0.75rem;
      justify-items: center;
    }
    .preview canvas {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--muted);
    }
    .message {
      min-height: 1.5em;
      font-size: 0.9375rem;
    }
    .error {
      color: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      .error {
        color: #f28b82;
      }
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>QR modül testi</h1>
    <p class="muted">Sadece qr-render.js modülünü denemek için.</p>

    <div class="layout">
      <form id="form" autocomplete="off">
        <label>Metin / URL
          <textarea id="text">https://www.linkedin.com/in/ornek</textarea>
        </label>

        <div class="row">
          <label>Ön plan <input id="fg" type="color" value="#000000"></label>
          <label>Arka plan <input id="bg" type="color" value="#ffffff"></label>
          <label>Hata düzeltme
            <select id="ecl">
              <option value="L">L (%7)</option>
              <option value="M" selected>M (%15)</option>
              <option value="Q">Q (%25)</option>
              <option value="H">H (%30)</option>
            </select>
          </label>
          <label>Sessiz alan
            <input id="quiet" type="number" min="0" max="10" step="1" value="4">
          </label>
        </div>

        <label>Logo (PNG, JPG, WEBP, SVG · en fazla 5 MB)
          <input id="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg">
        </label>
        <label>Logo boyutu: <span id="logoScaleValue">0.22</span>
          <input id="logoScale" type="range" min="0.1" max="0.28" step="0.01" value="0.22">
        </label>
        <div class="row">
          <button id="removeLogo" class="secondary" type="button" hidden>Logoyu kaldır</button>
        </div>
      </form>

      <section class="preview" aria-label="Önizleme">
        <div id="canvasHost"></div>
        <p id="warning" class="message muted" role="status"></p>
        <p id="error" class="message error" role="alert"></p>
        <div class="row">
          <button id="downloadPng" type="button">PNG indir (2048px)</button>
          <button id="downloadSvg" type="button">SVG indir</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../vendor/qrcode.min.js"></script>
  <script src="../assets/js/qr-render.js"></script>
  <script src="../assets/js/image-utils.js"></script>
  <script src="../assets/js/contrast.js"></script>
  <script>
    (function () {
      "use strict";

      var $ = function (id) { return document.getElementById(id); };
      var logoImg = null;

      function options(size) {
        return {
          text: $("text").value,
          fg: $("fg").value,
          bg: $("bg").value,
          ecl: $("ecl").value,
          quiet: Number($("quiet").value) || 0,
          logo: logoImg,
          logoScale: Number($("logoScale").value),
          size: size
        };
      }

      function setError(msg) {
        $("error").textContent = msg || "";
      }

      function update() {
        $("logoScaleValue").textContent = Number($("logoScale").value).toFixed(2);
        $("ecl").disabled = !!logoImg;
        if (logoImg) $("ecl").value = "H";
        $("warning").textContent = contrastWarning($("fg").value, $("bg").value) || "";

        var host = $("canvasHost");
        try {
          var result = renderQR(options(640));
          host.replaceChildren(result.canvas);
          setError("");
          toggleDownloads(true);
        } catch (e) {
          host.replaceChildren();
          setError(e.message);
          toggleDownloads(false);
        }
      }

      function toggleDownloads(enabled) {
        $("downloadPng").disabled = !enabled;
        $("downloadSvg").disabled = !enabled;
      }

      function download(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      $("form").addEventListener("input", function (e) {
        if (e.target.id !== "logo") update();
      });

      $("logo").addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        setError("");
        loadImageFromFile(file)
          .then(normalizeLogo)
          .then(function (norm) {
            var img = new Image();
            img.src = norm.dataURL;
            return img.decode().then(function () { return img; });
          })
          .then(function (img) {
            logoImg = img;
            $("removeLogo").hidden = false;
            update();
          })
          .catch(function (err) {
            e.target.value = "";
            setError(err.message);
          });
      });

      $("removeLogo").addEventListener("click", function () {
        logoImg = null;
        $("logo").value = "";
        $("removeLogo").hidden = true;
        update();
      });

      $("downloadPng").addEventListener("click", function () {
        try {
          renderQR(options(2048)).toPNGBlob()
            .then(function (blob) { download(blob, "qr.png"); })
            .catch(function (err) { setError(err.message); });
        } catch (err) {
          setError(err.message);
        }
      });

      $("downloadSvg").addEventListener("click", function () {
        try {
          var svg = renderQR(options(1024)).toSVGString();
          download(new Blob([svg], { type: "image/svg+xml" }), "qr.svg");
        } catch (err) {
          setError(err.message);
        }
      });

      update();
    })();
  </script>
</body>
</html>
